name: Promote v1.3.2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/promote-v1.3.2.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download v1.3.1 base package
        run: |
          mkdir -p build
          curl -fL --retry 3 \
            -o build/base.zip \
            'https://github.com/yuyu107/FeverGames-LegacyWindows-Downloader/releases/download/v1.3.1/FeverGames_LegacyWindows_Downloader_v1.3.1.zip'

      - name: Build v1.3.2 and sync source
        shell: python
        run: |
          from pathlib import Path
          import hashlib, re, shutil, zipfile

          repo = Path.cwd()
          build = repo / 'build'
          extracted = build / 'extracted'
          if extracted.exists():
              shutil.rmtree(extracted)
          extracted.mkdir(parents=True)

          with zipfile.ZipFile(build / 'base.zip', 'r') as z:
              z.extractall(extracted)

          dirs = [p for p in extracted.iterdir() if p.is_dir()]
          if len(dirs) != 1:
              raise SystemExit(f'Unexpected package structure: {dirs}')
          package = dirs[0]

          managed_check = r'''function Is-ManagedExe([string]$Path) {
              if (-not (Test-Path $Path -PathType Leaf)) { return $false }
              $fs = $null
              $br = $null
              try {
                  $fs = New-Object System.IO.FileStream($Path,[System.IO.FileMode]::Open,[System.IO.FileAccess]::Read,[System.IO.FileShare]::ReadWrite)
                  $br = New-Object System.IO.BinaryReader -ArgumentList $fs
                  if ($fs.Length -lt 256) { return $false }
                  if ($br.ReadUInt16() -ne 0x5A4D) { return $false }
                  [void]$fs.Seek(0x3C,[System.IO.SeekOrigin]::Begin)
                  $peOffset = $br.ReadInt32()
                  if ($peOffset -lt 0 -or ([Int64]$peOffset + 24) -gt $fs.Length) { return $false }
                  [void]$fs.Seek($peOffset,[System.IO.SeekOrigin]::Begin)
                  if ($br.ReadUInt32() -ne 0x00004550) { return $false }
                  [void]$fs.Seek(([Int64]$peOffset + 20),[System.IO.SeekOrigin]::Begin)
                  $optionalSize = $br.ReadUInt16()
                  $optionalStart = [Int64]$peOffset + 24
                  if ($optionalSize -lt 2 -or ($optionalStart + $optionalSize) -gt $fs.Length) { return $false }
                  [void]$fs.Seek($optionalStart,[System.IO.SeekOrigin]::Begin)
                  $magic = $br.ReadUInt16()
                  if ($magic -eq 0x10B) { $dataDirectoryStart = $optionalStart + 96 }
                  elseif ($magic -eq 0x20B) { $dataDirectoryStart = $optionalStart + 112 }
                  else { return $false }
                  $clrEntry = $dataDirectoryStart + (14 * 8)
                  if (($clrEntry + 8) -gt ($optionalStart + $optionalSize)) { return $false }
                  [void]$fs.Seek($clrEntry,[System.IO.SeekOrigin]::Begin)
                  $clrRva = $br.ReadUInt32()
                  $clrSize = $br.ReadUInt32()
                  return (($clrRva -ne 0) -and ($clrSize -ne 0))
              }
              catch { return $false }
              finally {
                  if ($br -ne $null) { $br.Close() }
                  elseif ($fs -ne $null) { $fs.Close() }
              }
          }'''

          func_re = re.compile(r'function Is-ManagedExe\(\[string\]\$Path\)\s*\{.*?\n\}', re.S)
          for rel in ['core/Install_From_Zero_v1.3.ps1', 'core/Check_Status_v1.3.ps1']:
              p = package / rel
              text = p.read_text(encoding='utf-8-sig')
              text, count = func_re.subn(managed_check, text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not replace Is-ManagedExe in {rel}')
              if rel.endswith('Install_From_Zero_v1.3.ps1'):
                  text = text.replace('$PackageVersion = "1.3.1"', '$PackageVersion = "1.3.2"')
                  text = text.replace('$PackageVersion = "1.3.0"', '$PackageVersion = "1.3.2"')
                  text = text.replace('Compiled downloader did not validate as a managed .NET executable.', 'Compiled downloader PE header does not contain a CLR/COM descriptor.')
              else:
                  text = text.replace('FeverGames Legacy Windows Downloader v1.3.1 - Status', 'FeverGames Legacy Windows Downloader v1.3.2 - Status')
              p.write_text(text, encoding='utf-8-sig')

          replacements = {
              'core/Install_Latest_FeverGames_v1.3.ps1': [
                  ('FeverGames Legacy Windows Downloader v1.3.1', 'FeverGames Legacy Windows Downloader v1.3.2')
              ],
              'core/Collect_Diagnostics_v1.3.ps1': [
                  ('FeverGames_v1.3.1_Diagnostic_Result', 'FeverGames_v1.3.2_Diagnostic_Result')
              ],
              '01_一键安装.cmd': [
                  ('FeverGames Legacy Windows Downloader v1.3.1', 'FeverGames Legacy Windows Downloader v1.3.2')
              ],
          }
          for rel, pairs in replacements.items():
              p = package / rel
              text = p.read_text(encoding='utf-8-sig')
              for old, new in pairs:
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8-sig')

          version_text = '''FeverGames Legacy Windows Downloader
Version: 1.3.2
Release status: Stable
Verified frontend layouts:
- FeverGames 1.18.42.12 / layout A
- FeverGames 1.18.42.14 / layout A
- FeverGames 1.18.42.14 / layout B
Verified 1.18.42.14 layout B original SHA256:
0a2a9568ac788227f0815e3c23761cadc11b51ee4ba9b86336cb2abf61e178e9

v1.3.2 compatibility fix:
- Managed downloadIPC validation is CLR-independent and PowerShell 2.0 safe.
- Verified on a Windows 7 environment that failed v1.3.1 validation but succeeds with v1.3.2 logic.
'''
          (package / 'core/VERSION.txt').write_text(version_text, encoding='utf-8-sig')

          guide = '''FeverGames Legacy Windows Downloader v1.3.2
============================================================

用途
----
用于恢复 FeverGames 新版下载后端在 Windows 7 SP1 x64 上的运行能力。
本工具解决的是 FeverGames 的“下载流程兼容”，不是保证所有下载下来的游戏本体都能在 Windows 7 上运行。

v1.3.2 主要修复
----------------
- 修复部分较原生 Windows 7 / PowerShell 2.0 环境中，对刚编译出的 .NET downloadIPC.exe 发生误判并中止安装的问题。
- 不再让当前旧 CLR 加载目标程序集来判断是否为托管 EXE；改为直接读取 PE Optional Header 的 CLR / COM Descriptor。
- 状态检查同步使用同一套 CLR-independent 判断，避免安装成功后再次误报。
- 该修复已由一台 v1.3.1 会稳定报错的 Windows 7 实机通过 v1.3.2-test1 验证成功。

除上述验证逻辑外，layout A/B、5 点精确字节补丁、v1.2 .NET 下载核心、自定义 FeverGames 路径、7-Zip 检测和 UAC 流程均保持 v1.3.1 行为。

使用方法
--------
1. 正常安装或更新 FeverGames，然后完全退出。
2. 确保电脑有可用的 7-Zip，默认或自定义安装目录均可。
3. 双击 01_一键安装.cmd。
4. 接受 UAC，并等待安装和自动状态检查结束。

正常状态
--------
Patch profile: 1.18.42.14 / layout B
Frontend patch count: 5/5
downloadIPC.exe = managed Win7 replacement
rollback backup = COMPLETE
RESULT=READY_FOR_WIN7_FEVERGAMES_DOWNLOAD

其他入口
--------
02_检查状态.cmd：只检查状态。
03_恢复官方文件.cmd：恢复官方原始文件。
04_收集诊断.cmd：收集诊断结果。

已验证前端布局
--------------
FeverGames 1.18.42.12 / layout A
FeverGames 1.18.42.14 / layout A
FeverGames 1.18.42.14 / layout B

1.18.42.14 / layout B 原版 FeverGamesInstaller.exe SHA-256：
0a2a9568ac788227f0815e3c23761cadc11b51ee4ba9b86336cb2abf61e178e9

安全和隐私
----------
本项目不实现账号登录绕过，不分发游戏内容，也不需要账号密码。
请勿公开 PRIVATE Manifest response、AES key、Token、Cookie、deviceId、uid、sig、secKey 或其它账号 / 临时鉴权信息。

版本：v1.3.2
'''
          (package / '使用说明.txt').write_text(guide, encoding='utf-8-sig')

          renamed = extracted / 'FeverGames_LegacyWindows_Downloader_v1.3.2'
          package.rename(renamed)
          package = renamed

          # Sync the exact release core to the source tree.
          core_names = [
              'Check_Latest_FeverGames_Status_v1.3.ps1',
              'Check_Status_v1.3.ps1',
              'Collect_Diagnostics_v1.3.ps1',
              'FeverGames_PatchProfiles_v1.3.ps1',
              'FeverGames_VersionResolver_v1.3.ps1',
              'Install_From_Zero_v1.3.ps1',
              'Install_Latest_FeverGames_v1.3.ps1',
              'Restore_Latest_FeverGames_v1.3.ps1',
              'Restore_Official_Original_v1.3.ps1',
              'Run_Install_Elevated_v1.3.ps1',
          ]
          for name in core_names:
              shutil.copy2(package / 'core' / name, repo / name)
          shutil.copy2(package / 'core/VERSION.txt', repo / 'VERSION.txt')
          shutil.copy2(package / '使用说明.txt', repo / '00_使用说明.txt')

          (repo / '01_Zero_Start_One_Click_Install.cmd').write_text('''@echo off
setlocal
cd /d "%~dp0"
powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Prepare_Source_v1.2.ps1"
if errorlevel 1 goto :end
powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Run_Install_Elevated_v1.3.ps1"
set "RC=%ERRORLEVEL%"
if not "%RC%"=="0" goto :end
powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Check_Latest_FeverGames_Status_v1.3.ps1"
:end
echo.
pause
''', encoding='utf-8')
          (repo / '02_Check_Status.cmd').write_text('@echo off\nsetlocal\ncd /d "%~dp0"\npowershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Check_Latest_FeverGames_Status_v1.3.ps1"\necho.\npause\n', encoding='utf-8')
          (repo / '03_Restore_Official_Original.cmd').write_text('@echo off\nsetlocal\ncd /d "%~dp0"\npowershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Restore_Latest_FeverGames_v1.3.ps1"\necho.\npause\n', encoding='utf-8')
          (repo / '04_Collect_Diagnostics.cmd').write_text('@echo off\nsetlocal\ncd /d "%~dp0"\npowershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Collect_Diagnostics_v1.3.ps1"\necho.\npause\n', encoding='utf-8')

          out_zip = build / 'FeverGames_LegacyWindows_Downloader_v1.3.2.zip'
          with zipfile.ZipFile(out_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(package.rglob('*')):
                  if p.is_file():
                      z.write(p, p.relative_to(extracted).as_posix())

          digest = hashlib.sha256(out_zip.read_bytes()).hexdigest()
          sha_line = f'{digest}  {out_zip.name}\n'
          (repo / 'RELEASE_SHA256_v1.3.2.txt').write_text(sha_line, encoding='ascii')
          print('Release SHA256:', digest)

          # Clean one-off workflows before tagging the source commit.
          for rel in ['.github/workflows/build-v1.3.2-test1.yml', '.github/workflows/promote-v1.3.2.yml']:
              p = repo / rel
              if p.exists():
                  p.unlink()

      - name: Commit promoted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: promote verified fix to v1.3.2"
          git push origin HEAD:main

      - name: Publish v1.3.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3.2 \
            build/FeverGames_LegacyWindows_Downloader_v1.3.2.zip \
            RELEASE_SHA256_v1.3.2.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "v1.3.2 - 修复 PowerShell 2.0 / CLR 托管 EXE 验证误判" \
            --notes-file RELEASE_NOTES_v1.3.2_CN.md
