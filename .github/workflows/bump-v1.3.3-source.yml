name: Bump v1.3.3 Source Version

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bump-v1.3.3-source.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update source package version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/current/Install_From_Zero_v1.3.ps1')
          raw = p.read_text(encoding='utf-8-sig')
          raw = raw.replace('$PackageVersion = "1.3.2"', '$PackageVersion = "1.3.3"')
          p.write_text(raw, encoding='utf-8-sig')
          PY

      - name: Commit and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bump-v1.3.3-source.yml
          git add scripts/current/Install_From_Zero_v1.3.ps1
          if git diff --cached --quiet; then
            echo "No source version changes."
            exit 0
          fi
          git commit -m "chore: bump source package version to v1.3.3"
          git push
