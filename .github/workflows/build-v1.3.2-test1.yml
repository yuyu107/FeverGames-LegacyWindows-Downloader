name: Build v1.3.2-test1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-v1.3.2-test1.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download v1.3.1 release package
        run: |
          curl -fL --retry 3 \
            -o base.zip \
            'https://github.com/yuyu107/FeverGames-LegacyWindows-Downloader/releases/download/v1.3.1/FeverGames_LegacyWindows_Downloader_v1.3.1.zip'
          mkdir package
          unzip -q base.zip -d package
          find package -maxdepth 3 -type f -print

      - name: Apply PowerShell 2.0 / CLR-independent managed EXE validation fix
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('package')
          candidates = list(root.rglob('Install_From_Zero_v1.3.ps1'))
          if len(candidates) != 1:
              raise SystemExit(f'Expected exactly one Install_From_Zero_v1.3.ps1, found: {candidates}')

          p = candidates[0]
          text = p.read_text(encoding='utf-8-sig')

          old_pattern = re.compile(
              r'function Is-ManagedExe\(\[string\]\$Path\)\s*\{.*?\n\}',
              re.S,
          )

          replacement = r'''function Is-ManagedExe([string]$Path) {
              if (-not (Test-Path $Path -PathType Leaf)) { return $false }

              $fs = $null
              $br = $null
              try {
                  $fs = New-Object System.IO.FileStream(
                      $Path,
                      [System.IO.FileMode]::Open,
                      [System.IO.FileAccess]::Read,
                      [System.IO.FileShare]::ReadWrite
                  )
                  $br = New-Object System.IO.BinaryReader -ArgumentList $fs

                  if ($fs.Length -lt 256) { return $false }

                  if ($br.ReadUInt16() -ne 0x5A4D) { return $false }

                  [void]$fs.Seek(0x3C,[System.IO.SeekOrigin]::Begin)
                  $peOffset = $br.ReadInt32()
                  if ($peOffset -lt 0 -or ([Int64]$peOffset + 24) -gt $fs.Length) { return $false }

                  [void]$fs.Seek($peOffset,[System.IO.SeekOrigin]::Begin)
                  if ($br.ReadUInt32() -ne 0x00004550) { return $false }

                  [void]$fs.Seek(([Int64]$peOffset + 20),[System.IO.SeekOrigin]::Begin)
                  $optionalSize = $br.ReadUInt16()
                  $optionalStart = [Int64]$peOffset + 24
                  if ($optionalSize -lt 2 -or ($optionalStart + $optionalSize) -gt $fs.Length) { return $false }

                  [void]$fs.Seek($optionalStart,[System.IO.SeekOrigin]::Begin)
                  $magic = $br.ReadUInt16()
                  if ($magic -eq 0x10B) {
                      $dataDirectoryStart = $optionalStart + 96
                  }
                  elseif ($magic -eq 0x20B) {
                      $dataDirectoryStart = $optionalStart + 112
                  }
                  else {
                      return $false
                  }

                  $clrEntry = $dataDirectoryStart + (14 * 8)
                  if (($clrEntry + 8) -gt ($optionalStart + $optionalSize)) { return $false }

                  [void]$fs.Seek($clrEntry,[System.IO.SeekOrigin]::Begin)
                  $clrRva = $br.ReadUInt32()
                  $clrSize = $br.ReadUInt32()

                  return (($clrRva -ne 0) -and ($clrSize -ne 0))
              }
              catch {
                  return $false
              }
              finally {
                  if ($br -ne $null) { $br.Close() }
                  elseif ($fs -ne $null) { $fs.Close() }
              }
          }'''

          new_text, count = old_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace Is-ManagedExe function safely.')

          # Keep the release behavior intact, but make the test build visible in logs.
          new_text = new_text.replace('$PackageVersion = "1.3.1"', '$PackageVersion = "1.3.2-test1"')
          new_text = new_text.replace('$PackageVersion = "1.3.0"', '$PackageVersion = "1.3.2-test1"')

          needle = 'if (-not (Is-ManagedExe $compiledDownloader)) { throw "Compiled downloader did not validate as a managed .NET executable." }'
          diagnostic = '''if (-not (Is-ManagedExe $compiledDownloader)) {
              if (Test-Path $compiledDownloader) {
                  try { Info ("Compiled downloader size: " + (Get-Item $compiledDownloader).Length + " bytes") } catch {}
                  try { Info ("Compiled downloader SHA256: " + (Get-Sha256 $compiledDownloader)) } catch {}
              }
              throw "Compiled downloader PE header does not contain a CLR/COM descriptor."
          }'''
          if needle in new_text:
              new_text = new_text.replace(needle, diagnostic, 1)

          p.write_text(new_text, encoding='utf-8-sig')

          note = root / 'v1.3.2-test1_测试说明.txt'
          note.write_text(
              'FeverGames Legacy Windows Downloader v1.3.2-test1\n\n'
              '此测试包直接基于已发布的 v1.3.1 Release ZIP 制作。\n'
              '唯一功能性改动：修复 Windows 7 / PowerShell 2.0 环境下，使用当前 CLR 加载 .NET 4 编译结果可能导致的 managed EXE 误判。\n'
              '新的判断方式直接读取 PE Optional Header 的 CLR/COM Descriptor，不要求当前 PowerShell CLR 能加载目标程序集。\n\n'
              '请完全退出发烧游戏后运行 01_一键安装.cmd。\n'
              '如果仍失败，请截图完整窗口，或运行 04_收集诊断.cmd。\n'
              '此包仅用于验证问题，验证完成前不要替代 v1.3.1 正式版。\n',
              encoding='utf-8-sig'
          )

          print('Patched:', p)

      - name: Repack test build
        run: |
          cd package
          zip -qr ../FeverGames_LegacyWindows_Downloader_v1.3.2-test1.zip .
          cd ..
          sha256sum FeverGames_LegacyWindows_Downloader_v1.3.2-test1.zip | tee SHA256_v1.3.2-test1.txt

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: FeverGames_LegacyWindows_Downloader_v1.3.2-test1
          path: |
            FeverGames_LegacyWindows_Downloader_v1.3.2-test1.zip
            SHA256_v1.3.2-test1.txt
          if-no-files-found: error
          retention-days: 30
